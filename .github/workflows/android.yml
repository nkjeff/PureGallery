name: Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build optimized release APKs
        run: gradle --no-daemon assembleRelease
      - name: Show APK sizes
        run: find app/build/outputs/apk/release -name '*.apk' -exec ls -lh {} \;
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PureGallery-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
